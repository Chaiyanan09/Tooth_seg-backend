spring.application.name=tooth-seg-backend
server.port=${PORT:8080}

# PostgreSQL
# Override with environment variables when deploying:
#   SPRING_DATASOURCE_URL      e.g. jdbc:postgresql://<host>:5432/<database>
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/toothseg}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:toothseg_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
# Flyway creates and changes tables; Hibernate only checks that the entities match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway: runs SQL files in src/main/resources/db/migration on startup
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${APP_JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_32_CHARS_MINIMUM________}
app.jwt.accessMinutes=${APP_JWT_ACCESS_MINUTES:120}

# Frontend (reset link)
app.frontend.baseUrl=${APP_FRONTEND_BASEURL:http://localhost:3000}
app.reset.expiresMinutes=${APP_RESET_EXPIRES_MINUTES:15}

# Mailjet
mailjet.apiKey=${MAILJET_API_KEY:}
mailjet.apiSecret=${MAILJET_API_SECRET:}

# Mail identity (????? from name/email)
app.mail.from=${APP_MAIL_FROM:}
app.mail.fromName=${APP_MAIL_FROMNAME:ToothAI}

# ML
app.ml.baseUrl=${APP_ML_BASEURL:http://127.0.0.1:8000}
app.ml.apiKey=${APP_ML_APIKEY:CHANGE_ME}

# Upload limits (Multipart)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# (?????) ??? Tomcat ??? 413 ?????????
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB

# Cloudinary (???????? env ?? Railway/???????????)
app.cloudinary.url=${CLOUDINARY_URL:}
app.cloudinary.folder=${CLOUDINARY_FOLDER:toothseg}